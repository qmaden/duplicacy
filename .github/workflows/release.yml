name: Release

# Pushing a tag such as v3.3.0 (or v3.3.0-rc1 for a pre-release) builds the binaries and the .deb package and
# publishes them as a GitHub release.  See docs/BUILDING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"
  GOTOOLCHAIN: local

jobs:
  test:
    name: Check the tag and run the tests
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not of the form v1.2.3 or v1.2.3-rc1"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tests
        run: go test -count=1 -timeout 30m ./...

  linux:
    name: Linux x86-64 binary and .deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          DEB_MAINTAINER: ${{ vars.DEB_MAINTAINER }}
        run: |
          version=${GITHUB_REF_NAME#v}
          .github/scripts/build-release.sh binary linux amd64 "$version"
          .github/scripts/build-release.sh deb "$version"
      - name: Install the package and run it
        run: |
          sudo dpkg -i dist/*.deb
          duplicacy -h | grep -A1 VERSION
          duplicacy -h | grep -q "${GITHUB_REF_NAME#v}"
          sudo dpkg -r duplicacy
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS binaries
    needs: test
    # Keychain support needs cgo, so the macOS binaries are built on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          version=${GITHUB_REF_NAME#v}
          .github/scripts/build-release.sh binary darwin arm64 "$version"
          .github/scripts/build-release.sh binary darwin amd64 "$version"
          file dist/*
          ./dist/duplicacy_osx_arm64_* -h | grep -A1 VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" * --title "Duplicacy ${GITHUB_REF_NAME#v}" --generate-notes \
            --verify-tag $prerelease
